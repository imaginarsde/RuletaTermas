name: Build Final Ruleta APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare offline web assets
        run: |
          set -euxo pipefail
          rm -rf app/src/main/assets
          mkdir -p app/src/main/assets
          cp web_assets/index.html app/src/main/assets/index.html
          cat web_assets/bg.part*.b64 | tr -d '\n\r' | base64 -d > app/src/main/assets/fondoapp.webp
          test -s app/src/main/assets/index.html
          test -s app/src/main/assets/fondoapp.webp
          echo "3dce94b5bf1d83afdb7f4c3c3896f32195ccb18970046db15cc514c5025572f0  app/src/main/assets/fondoapp.webp" | sha256sum -c -

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK with official Android toolchain
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ruleta.apk

      - name: Validate APK assets
        run: |
          unzip -l ruleta.apk | grep 'assets/index.html'
          unzip -l ruleta.apk | grep 'assets/fondoapp.webp'
          unzip -t ruleta.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ruleta-apk
          path: ruleta.apk
