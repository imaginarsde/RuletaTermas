name: Build Final Ruleta APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare offline web assets
        run: |
          rm -rf app/src/main/assets
          mkdir -p app/src/main/assets
          unzip -o web_bundle.zip -d app/src/main/assets
          test -f app/src/main/assets/index.html
          test -f app/src/main/assets/fondoapp.webp

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK with official Android toolchain
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ruleta.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ruleta-apk
          path: ruleta.apk
